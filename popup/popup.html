<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundCloud Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-box">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" stroke="#ff5500" fill="rgba(255,85,0,0.15)"/>
          <path d="M12 11v6m-3-3 3 3 3-3" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="logo-text">
          <h1>SoundCloud <span>Downloader</span></h1>
          <p>Tự động tải nhạc MP3 chất lượng cao</p>
        </div>
      </div>
      <div class="tabs">
        <button id="tabDownloader" class="tab-btn active" title="Tải nhạc">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button id="tabHistory" class="tab-btn" title="Lịch sử tải">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
      </div>
    </header>

    <!-- Main View: Downloader -->
    <main id="viewDownloader" class="view-content">
      <div class="input-section">
        <div class="input-wrapper">
          <input type="text" id="urlInput" placeholder="Dán link SoundCloud tại đây..." autocomplete="off" spellcheck="false">
          <button id="btnPaste" class="icon-btn" title="Dán từ Clipboard hoặc Tab hiện tại">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
          </button>
        </div>

        <div class="action-buttons">
          <button id="btnCurrentTab" class="btn btn-secondary">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><path d="m10 15 5-3-5-3v6Z"/></svg>
            Lấy link tab này
          </button>
          <button id="btnDownload" class="btn btn-primary">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Tải ngay
          </button>
        </div>
      </div>

      <!-- Trạng thái / Tiến trình -->
      <div id="statusBox" class="status-box hidden">
        <div class="status-header">
          <span id="statusSpinner" class="spinner"></span>
          <span id="statusText">Đang phân tích liên kết...</span>
          <span id="statusPercent" class="status-percent"></span>
        </div>
        <div id="progressBarContainer" class="progress-bar-container hidden">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <!-- Track Preview Card -->
      <div id="trackCard" class="track-card hidden">
        <div class="card-inner">
          <img id="trackArtwork" class="track-art" src="" alt="Artwork">
          <div class="track-info">
            <h3 id="trackTitle" class="track-title" title="">Tên bài hát</h3>
            <p id="trackArtist" class="track-artist">Nghệ sĩ</p>
            <div class="track-meta">
              <span id="trackDuration" class="meta-badge">0:00</span>
              <span id="trackQuality" class="meta-badge quality">MP3 128kbps</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- History View -->
    <main id="viewHistory" class="view-content hidden">
      <div class="history-header">
        <h2>Bài hát đã tải gần đây</h2>
        <button id="btnClearHistory" class="clear-btn" title="Xóa toàn bộ lịch sử">Xóa lịch sử</button>
      </div>
      <div id="historyList" class="history-list">
        <!-- Các mục lịch sử sẽ chèn qua JS -->
      </div>
      <div id="historyEmpty" class="history-empty">
        <svg viewBox="0 0 24 24" width="36" height="36" stroke="#555" stroke-width="1.5" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <p>Chưa có bài hát nào được tải.</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>Mẹo: Bạn có thể bấm nút "⚡ Download MP3" trực tiếp trên trang soundcloud.com</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
